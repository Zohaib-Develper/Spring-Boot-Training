spring:
  application:
    name: news-api
  boot:
    admin:
      context-path: /admin
  security:
    oauth2:
      client:
        provider:
          github:
            user-name-attribute: login
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite
        embedding:
          api-key: ${GEMINI_API_KEY}
          options:
            model: gemini-embedding-001