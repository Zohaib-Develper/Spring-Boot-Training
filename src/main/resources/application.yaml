spring:
  application:
    name: news-api
  boot:
    admin:
      context-path: /admin
  security:
    oauth2:
      client:
        provider:
          github:
            user-name-attribute: login
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
server:
  servlet:
    session:
      cookie:
        same-site: lax
