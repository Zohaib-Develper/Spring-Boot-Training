logging:
  level:
    sql: debug
    web: debug
  #    liquibase: debug
  #    org.springframework.security: debug
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    export:
      enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4317
          transport: gRPC
    metrics:
      export:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
