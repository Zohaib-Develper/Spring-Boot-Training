spring:
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite
        embedding:
          api-key: ${GEMINI_API_KEY}
          options:
            model: gemini-embedding-001
logging:
  level:
    sql: debug
    web: debug
  #    liquibase: debug
  #    org.springframework.security: debug
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    export:
      enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4317
          transport: gRPC
    metrics:
      export:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
